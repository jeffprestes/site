server {
    server_name tarefas.jeffprestes.info;

    root /home/hermes/projects/site/tarefas;
    index index.html;

    access_log /var/log/nginx/tarefas.jeffprestes.info.access.log;
    error_log /var/log/nginx/tarefas.jeffprestes.info.error.log;


    location = / {
        default_type text/html;
        try_files /index.html =404;
    }

    location = /index.html {
        default_type text/html;
        try_files /index.html =404;
    }

    location = /tasks.json {
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /tasks.json =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files /sw.js =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=300" always;
        try_files /manifest.webmanifest =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tarefas.jeffprestes.info/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tarefas.jeffprestes.info/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tarefas.jeffprestes.info) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tarefas.jeffprestes.info;
    return 404; # managed by Certbot


}